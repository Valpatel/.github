name: check
# Every pull request: the profile must render the way the review checks it by hand.
# - The banners are what the pinned generator draws from profile/hero.json and the repo's own content.
# - Every image the README links from this repo exists in the tree.
# - Linked cards carry no prefers-color-scheme CSS: iOS draws SVG-in-<img> in its light scheme, ignoring the page.
# - The generator pin matches profile.yml's pin.
# - No private-network address (tailnet or LAN) and no home directory path appears in tracked text, this file included.
# Standard library only.
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: mvalancy/mvalancy
          ref: b9c7f19c1f362f8a5b0e921de37425bc7e8e7d3f  # keep equal to profile.yml's pin
          path: .gen
          persist-credentials: false
      - name: The generator pin matches profile.yml
        run: |
          a=$(grep -o 'ref: [0-9a-f]\{40\}' .github/workflows/profile.yml || true)
          b=$(grep -o 'ref: [0-9a-f]\{40\}' .github/workflows/check.yml || true)
          [ -n "$a" ] || { echo "profile.yml's generator ref is not a full commit SHA"; exit 1; }
          [ "$a" = "$b" ] || { echo "profile.yml pins '$a' but check.yml pins '$b'"; exit 1; }
      - name: Banners match the pinned generator
        run: |
          python3 .gen/tools/hero/heroes.py --check --repo Valpatel/.github=.
          python3 .gen/tools/hero/heroes.py --check --spec profile/hero.json
      - name: README images exist and linked cards are single-scheme
        run: |
          python3 - <<'EOF'
          import pathlib, re, sys
          readme = pathlib.Path('profile/README.md').read_text()
          prefix = 'https://raw.githubusercontent.com/Valpatel/.github/main/'
          bad = []
          paths = sorted(set(re.findall(re.escape(prefix) + r'([^"\s)]+)', readme)))
          for p in paths:
              if not pathlib.Path(p).is_file():
                  bad.append(f'{p}: linked from profile/README.md but not in the tree')
          for svg in sorted(pathlib.Path('assets').glob('*/*.svg')):
              if svg.parent.name in ('cards', 'spot') and 'prefers-color-scheme' in svg.read_text():
                  bad.append(f'{svg}: a linked card must not switch on prefers-color-scheme (iOS shows the light one)')
          print(f'{len(paths)} images checked')
          if bad:
              print('\n'.join(bad)); sys.exit(1)
          EOF
      - name: No private infrastructure in tracked text
        run: |
          # tailnet 100.64/10, LAN 10/8, 172.16/12 and 192.168/16, and Linux or macOS home directories
          if git grep -nIE "\\b(100\\.(6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])|10\\.[0-9]{1,3}|172\\.(1[6-9]|2[0-9]|3[01])|192\\.168)\\.[0-9]{1,3}\\.[0-9]{1,3}\\b|/(home|Users)/[a-z]" -- . ; then
            echo "private addresses or home paths found above"; exit 1
          fi
