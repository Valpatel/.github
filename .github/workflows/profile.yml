name: profile
# Once a day: refresh the stats strip, the "now building" ticker and the hero's event log in profile/README.md from
# the public GitHub API, redraw the hero, and commit only if something changed. The updater and the banner generator
# come from a pinned commit of mvalancy/mvalancy (tools/profile, tools/hero); they need only the Python standard library.
on:
  schedule:
    - cron: "23 13 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: profile
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: mvalancy/mvalancy
          ref: fca53c3e46cb70656d59ce187ee0e89b71100bf9  # mvalancy/mvalancy#7's head; repin to its merge commit
          path: .gen
          persist-credentials: false
      - name: Refresh the live sections and the hero's log
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .gen/tools/profile/update.py --config profile/live.json profile/README.md
      - name: Redraw the hero
        run: python3 .gen/tools/hero/heroes.py --spec profile/hero.json
      - name: Commit if changed
        run: |
          git add profile/README.md profile/hero.json assets/hero
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh profile stats, ticker and hero log"
          git push
